{% load static %}

<!-- Brand / utility row -->
<header class="stu-topbar">
  <a href="{% url 'library:library_dashboard' %}" class="stu-brand">
    <div class="stu-brand-mark">E</div>
    <div class="stu-brand-text">
      <div class="name">EMIS</div>
      <div class="sub">Library Portal</div>
    </div>
  </a>

  <div class="stu-topbar-right">
    <form action="{% url 'library:library_catalog' %}" method="get" class="stu-search">
      <i class="bi bi-search"></i>
      <input type="text" name="q" value="{{ query|default:'' }}" placeholder="Search title, author, ISBN…">
    </form>

    <div class="stu-user-chip">
      <div class="stu-user-avatar">{{ username|slice:":2"|upper }}</div>
      <div class="stu-user-meta">
        <div class="uname">{{ username }}</div>
        <div class="urole">Librarian</div>
      </div>
    </div>

    <a href="{% url 'library:library_logout' %}" class="stu-logout-btn" aria-label="Logout">
      <i class="bi bi-box-arrow-right"></i>
      <span>Logout</span>
    </a>

    <button class="stu-mobile-toggle" type="button" data-stu-nav-toggle aria-label="Toggle menu">
      <i class="bi bi-list"></i>
      <i class="bi bi-x"></i>
    </button>
  </div>
</header>

<!-- Horizontal nav row -->
<nav class="stu-navbar" id="stu-navbar">
  <div class="stu-nav">
    <a href="{% url 'library:library_dashboard' %}" class="stu-nav-link {% if request.resolver_match.url_name == 'library_dashboard' %}active{% endif %}">
      <i class="bi bi-grid-1x2"></i>Dashboard
    </a>
    <a href="{% url 'library:issue_book' %}" class="stu-nav-link {% if request.resolver_match.url_name == 'issue_book' %}active{% endif %}">
      <i class="bi bi-bag-plus"></i>Issue Book
    </a>
    <a href="{% url 'library:library_loans' %}" class="stu-nav-link {% if request.resolver_match.url_name == 'library_loans' or request.resolver_match.url_name == 'return_book' %}active{% endif %}">
      <i class="bi bi-journal-bookmark"></i>Loans &amp; Returns
    </a>
    <a href="{% url 'library:library_catalog' %}" class="stu-nav-link {% if request.resolver_match.url_name == 'library_catalog' %}active{% endif %}">
      <i class="bi bi-search"></i>Catalog
    </a>
  </div>
</nav>
